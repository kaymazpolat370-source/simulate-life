<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="monetag" content="c03cfe0d468327f30808ee670ff0cf60">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Life Simulator</title>
  <style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{background:#07070e;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}</style>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app-root">

  <!-- ======== LANGUAGE OVERLAY ======== -->
  <div id="lang-overlay" class="fso">
    <div class="ov-card">
      <div class="ov-ls-icon"></div>
      <h1 class="ov-title">Life Simulator</h1>
      <p class="ov-sub">Choose your language / Dilinizi seçin</p>
      <div class="lang-btns">
        <button class="lang-pick-btn" data-lang="en"><span class="flag en-flag"></span>English</button>
        <button class="lang-pick-btn" data-lang="tr"><span class="flag tr-flag"></span>Türkçe</button>
      </div>
    </div>
  </div>

  <!-- ======== MORNING REPORT OVERLAY (inside phone, absolute) ======== -->
  <!-- rendered dynamically via JS -->

  <!-- ======== SPONSOR OVERLAY (inside phone, absolute) ======== -->
  <!-- rendered dynamically via JS -->

  <!-- ======== PHONE FRAME ======== -->
  <div id="phone-frame">

    <!-- Dynamic overlays container (absolute, z:200) -->
    <div id="phone-overlays"></div>

    <!-- Notch -->
    <div class="p-notch"><div class="p-notch-pill"></div></div>

    <!-- Status Bar -->
    <div id="status-bar">
      <span id="sb-time">09:41</span>
      <div id="sb-center"><span id="sb-day-lbl"></span></div>
      <div id="sb-right">
        <span id="sb-cash" class="sb-cash">$50</span>
        <div class="batt"><div class="batt-body"><div class="batt-fill" id="batt-fill"></div></div><div class="batt-cap"></div></div>
        <span id="batt-pct" class="sb-batt">100%</span>
      </div>
    </div>

    <!-- Screen Container -->
    <div id="screen-wrap">

      <!-- ===== HOME SCREEN ===== -->
      <div id="screen-home" class="screen active">
        <div class="home-top">
          <div class="home-greeting" id="home-greeting"></div>
          <div class="home-stats-row">
            <div class="hs-pill hs-day"><span id="hs-day-val">1</span><span class="hs-lbl" id="hs-day-lbl"></span></div>
            <div class="hs-pill hs-flw"><span id="hs-flw-val">0</span><span class="hs-lbl" id="hs-flw-lbl"></span></div>
            <div class="hs-pill hs-algo"><span id="hs-algo-val">1.0x</span><span class="hs-lbl" id="hs-algo-lbl"></span></div>
          </div>
        </div>
        <div class="app-grid">
          <div class="app-tile" data-app="jobs">
            <div class="app-shape jobs-shape">
              <div class="jobs-icon-inner"><div class="ji-brief"></div><div class="ji-lines"><div></div><div></div></div></div>
            </div>
            <span class="app-lbl" id="app-lbl-jobs"></span>
          </div>
          <div class="app-tile" data-app="toktik">
            <div class="app-shape tt-shape">
              <div class="tt-icon-inner"><span class="ttl-T">T</span><span class="ttl-t">t</span></div>
            </div>
            <span class="app-lbl">TokTik</span>
          </div>
          <div class="app-tile" data-app="shop">
            <div class="app-shape shop-shape">
              <div class="shop-icon-inner"><div class="si-bag"><div class="si-handle"></div></div></div>
            </div>
            <span class="app-lbl" id="app-lbl-shop"></span>
          </div>
          <div class="app-tile" data-app="settings">
            <div class="app-shape settings-shape">
              <div class="gear-ring"><div class="gear-dot"></div></div>
            </div>
            <span class="app-lbl" id="app-lbl-settings"></span>
          </div>
        </div>
        <!-- Monetization ribbon (shown at 10K+) -->
        <div id="home-monetized-ribbon" class="monetized-ribbon hidden"></div>
      </div>

      <!-- ===== JOBS SCREEN ===== -->
      <div id="screen-jobs" class="screen">
        <div class="app-topbar">
          <button class="back-btn" data-back="home">&#8592;</button>
          <span class="app-topbar-title" id="jobs-title"></span>
        </div>
        <div class="jobs-body">
          <div class="jobs-energy-bar-section">
            <div class="jeb-label"><span id="jeb-lbl"></span><span id="jeb-val" class="jeb-val"></span></div>
            <div class="jeb-bar"><div class="jeb-fill" id="jeb-fill"></div></div>
          </div>
          <div class="jobs-notice" id="jobs-notice"></div>
          <div class="job-card" id="job-flyer">
            <div class="job-card-icon flyer-icon"></div>
            <div class="job-card-info">
              <div class="job-card-name" id="job-flyer-name"></div>
              <div class="job-card-details">
                <span class="job-energy-badge" id="job-flyer-energy"></span>
                <span class="job-reward-badge" id="job-flyer-reward"></span>
              </div>
            </div>
            <button class="job-do-btn" id="btn-flyer" data-job="flyer"></button>
          </div>
          <div class="job-card" id="job-moto">
            <div class="job-card-icon moto-icon"></div>
            <div class="job-card-info">
              <div class="job-card-name" id="job-moto-name"></div>
              <div class="job-card-details">
                <span class="job-energy-badge" id="job-moto-energy"></span>
                <span class="job-reward-badge" id="job-moto-reward"></span>
              </div>
            </div>
            <button class="job-do-btn" id="btn-moto" data-job="moto"></button>
          </div>
          <div class="jobs-tip" id="jobs-tip"></div>
        </div>
      </div>

      <!-- ===== SHOP SCREEN ===== -->
      <div id="screen-shop" class="screen">
        <div class="app-topbar">
          <button class="back-btn" data-back="home">&#8592;</button>
          <span class="app-topbar-title" id="shop-title"></span>
        </div>
        <div class="shop-body">
          <div class="shop-header-stats">
            <div class="shs-item"><span class="shs-lbl" id="shs-mult-lbl"></span><span class="shs-val" id="shs-mult-val"></span></div>
            <div class="shs-item"><span class="shs-lbl" id="shs-bpm-lbl"></span><span class="shs-val" id="shs-bpm-val"></span></div>
          </div>
          <div id="shop-items-list" class="shop-items-list"></div>
        </div>
      </div>

      <!-- ===== TOKTIK SCREEN ===== -->
      <div id="screen-toktik" class="screen">
        <!-- Setup flow -->
        <div id="tt-setup" class="tt-section">
          <div class="app-topbar">
            <button class="back-btn" data-back="home">&#8592;</button>
            <span class="tt-brand-text">TokTik</span>
          </div>
          <div class="tt-setup-body">
            <div class="tt-setup-logo"><span class="ttl-T">T</span><span class="ttl-t">t</span></div>
            <h2 id="tt-su-heading" class="tt-su-heading"></h2>
            <p id="tt-su-sub" class="tt-su-sub"></p>
            <div class="inp-group">
              <label class="inp-label" id="tt-su-label"></label>
              <input type="text" id="tt-username-inp" class="game-inp" maxlength="18" autocomplete="off" spellcheck="false">
              <span class="inp-hint" id="tt-su-hint"></span>
            </div>
            <button class="primary-btn w100" id="tt-register-btn"></button>
          </div>
        </div>
        <!-- Main dashboard -->
        <div id="tt-main" class="tt-section hidden">
          <div class="app-topbar">
            <button class="back-btn" data-back="home">&#8592;</button>
            <span class="tt-brand-text">TokTik</span>
            <span id="tt-day-lbl" class="day-badge"></span>
          </div>
          <div class="tt-tabs">
            <button class="tt-tab active" data-ttab="stats" id="ttab-stats"></button>
            <button class="tt-tab" data-ttab="create" id="ttab-create"></button>
            <button class="tt-tab" data-ttab="board" id="ttab-board"></button>
          </div>
          <!-- Stats Panel -->
          <div id="ttp-stats" class="tt-panel active">
            <div class="tt-profile-card">
              <div class="tt-ava" id="tt-ava"><span id="tt-ava-letter">?</span></div>
              <div class="tt-pinfo">
                <div class="tt-uname-row"><span class="tt-at">@</span><span id="tt-uname">user</span></div>
                <div class="tt-ctrs">
                  <div class="tt-ctr"><span class="tt-cnum" id="tt-ctr-f">0</span><span class="tt-clbl" id="tt-clbl-f"></span></div>
                  <div class="tt-cdiv"></div>
                  <div class="tt-ctr"><span class="tt-cnum" id="tt-ctr-l">0</span><span class="tt-clbl" id="tt-clbl-l"></span></div>
                  <div class="tt-cdiv"></div>
                  <div class="tt-ctr"><span class="tt-cnum" id="tt-ctr-v">0</span><span class="tt-clbl" id="tt-clbl-v"></span></div>
                </div>
              </div>
            </div>
            <div class="tt-algo-row">
              <span class="ttar-lbl" id="ttar-lbl"></span>
              <div class="ttar-bar-wrap"><div class="ttar-bar" id="ttar-bar"></div></div>
              <span class="ttar-val" id="ttar-val"></span>
            </div>
            <div class="tt-trending-box" id="tt-trending-box">
              <span class="ttrend-icon">🔥</span>
              <span id="ttrend-text" class="ttrend-text"></span>
            </div>
            <div class="tt-monetize-row" id="tt-monetize-row"></div>
            <div class="tt-rank-pill">
              <span id="ttrp-lbl" class="ttrp-lbl"></span>
              <span id="ttrp-val" class="ttrp-val">#101</span>
            </div>
            <div class="tt-pending-notice" id="tt-pending-notice"></div>
            <h4 class="sec-hd" id="tt-feed-hd"></h4>
            <div id="tt-feed" class="tt-feed"></div>
          </div>
          <!-- Create Panel -->
          <div id="ttp-create" class="tt-panel hidden">
            <div class="create-scroll">
              <div class="tt-trending-box" id="tt-trending-box-create">
                <span class="ttrend-icon">🔥</span>
                <span id="ttrend-text-create" class="ttrend-text"></span>
              </div>
              <div class="create-energy-notice" id="create-energy-notice"></div>
              <h4 class="picker-hd" id="fmt-pick-hd"></h4>
              <div id="fmt-grid" class="fmt-grid"></div>
              <h4 class="picker-hd" id="niche-pick-hd"></h4>
              <div id="niche-grid" class="niche-grid"></div>
              <div class="create-synergy-hint" id="create-synergy-hint"></div>
              <div class="create-preview-box" id="create-preview-box">
                <span id="cpb-icon" class="cpb-icon"></span>
                <span id="cpb-label" class="cpb-label"></span>
              </div>
              <button class="primary-btn w100 create-video-btn" id="btn-create-video"></button>
              <div class="create-done-notice" id="create-done-notice"></div>
            </div>
          </div>
          <!-- Leaderboard Panel -->
          <div id="ttp-board" class="tt-panel hidden">
            <h3 class="panel-title" id="lb-title"></h3>
            <p class="panel-sub" id="lb-sub"></p>
            <div id="lb-list" class="lb-list"></div>
          </div>
        </div>
      </div>

      <!-- ===== SETTINGS SCREEN ===== -->
      <div id="screen-settings" class="screen">
        <div class="app-topbar">
          <button class="back-btn" data-back="home">&#8592;</button>
          <span class="app-topbar-title" id="settings-title"></span>
        </div>
        <div class="settings-body">
          <div class="stg-group">
            <div class="stg-group-hd" id="stg-hd-audio"></div>
            <div class="stg-row">
              <span id="stg-sound-lbl"></span>
              <label class="toggle"><input type="checkbox" id="sound-toggle"><span class="tgl-track"><span class="tgl-thumb"></span></span></label>
            </div>
          </div>
          <div class="stg-group">
            <div class="stg-group-hd" id="stg-hd-lang"></div>
            <div class="stg-row">
              <span id="stg-lang-lbl"></span>
              <div class="lang-pair">
                <button class="lang-pair-btn" data-lang="en" id="lpb-en">EN</button>
                <button class="lang-pair-btn" data-lang="tr" id="lpb-tr">TR</button>
              </div>
            </div>
          </div>
          <div class="stg-group">
            <div class="stg-group-hd" id="stg-hd-privacy"></div>
            <button class="stg-btn" id="btn-show-privacy"></button>
          </div>
          <div class="stg-group">
            <div class="stg-group-hd" id="stg-hd-data"></div>
            <button class="stg-btn" id="btn-save-game"></button>
            <button class="stg-btn danger" id="btn-delete-data"></button>
          </div>
        </div>
      </div>

    </div><!-- /screen-wrap -->

    <!-- Toast (inside phone) -->
    <div id="toast" class="toast hidden"></div>
    <!-- Floating reward text -->
    <div id="float-reward" class="float-reward hidden"></div>

    <!-- Phone Bottom (always visible: energy + next day) -->
    <div id="phone-bottom">
      <div class="energy-bar-row">
        <span class="enr-icon">⚡</span>
        <div class="enr-track"><div class="enr-fill" id="enr-fill"></div></div>
        <span class="enr-val" id="enr-val">100/100</span>
      </div>
      <button id="btn-next-day" class="next-day-btn"></button>
    </div>

    <!-- Chin -->
    <div class="p-chin"><div class="home-ind"></div></div>
  </div><!-- /phone-frame -->

</div><!-- /app-root -->
<script src="./script.js"></script>
</body>
</html>
